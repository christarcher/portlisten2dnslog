[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portlistener2dns-server"
version = "2.0.0"
description = "DNSLog collector and Telegram notifier for portlistener2dns"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
portlistener2dns-server = "portlistener2dns_server.app:main"

[tool.setuptools.packages.find]
include = ["portlistener2dns_server*"]
